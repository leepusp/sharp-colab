name: Publish Bakta DB light release

on:
  workflow_dispatch:
  push:
    tags:
      - bakta-db-light-v6.0

permissions:
  contents: write

jobs:
  publish:
    name: Publish Bakta DB light release asset
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      RELEASE_TAG: bakta-db-light-v6.0
      RELEASE_NAME: Bakta DB light v6.0 for S(H)ARP Colab
      ASSET_NAME: db-light.tar.xz
      ZENODO_URL: https://zenodo.org/records/14916843/files/db-light.tar.xz?download=1
      EXPECTED_MD5: 4a6e059ded39e9c5537ef4137d2f5648

    steps:
      - name: Show context
        run: |
          set -euo pipefail
          echo "repository=${GITHUB_REPOSITORY}"
          echo "ref=${GITHUB_REF}"
          echo "ref_name=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          echo "release_tag=${RELEASE_TAG}"

      - name: Download Bakta DB light
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 10 \
            "${ZENODO_URL}" \
            -o "${ASSET_NAME}"
          ls -lh "${ASSET_NAME}"

      - name: Validate MD5 and SHA256
        run: |
          set -euo pipefail
          echo "${EXPECTED_MD5}  ${ASSET_NAME}" > "${ASSET_NAME}.md5"
          md5sum -c "${ASSET_NAME}.md5"
          sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          cat "${ASSET_NAME}.md5"
          cat "${ASSET_NAME}.sha256"

      - name: Inspect archive
        run: |
          set -euo pipefail
          tar -tJf "${ASSET_NAME}" | head -80

      - name: Write release notes
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'EOF'
Cached Bakta DB light v6.0 archive for S(H)ARP public Colab genome-only runs.

Asset: db-light.tar.xz
Source: Zenodo record 14916843
DOI: 10.5281/zenodo.14916843

This asset is not committed to git. It is published only as a GitHub Release asset.
EOF

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists: ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release upload "${RELEASE_TAG}" \
            "${ASSET_NAME}" \
            "${ASSET_NAME}.md5" \
            "${ASSET_NAME}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Validate public asset URL
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
          echo "URL=${URL}"
          curl -L --fail -I "${URL}" | sed -n '1,80p'
